[package]
name = "dosa"
version = "0.1.0"
edition = "2024"
description = "A GPU-rendered DOS emulator"

[workspace]
members = ["crates/cpu", "crates/desktop", "crates/dos", "crates/mount"]
resolver = "3"

[dependencies]
dosa-desktop = { path = "crates/desktop" }
dosa-dos = { path = "crates/dos" }
dosa-mount = { path = "crates/mount" }
png = "0.18"
tempfile = "3"
serde = { version = "1", features = ["derive", "rc"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
crc32fast = "1"
toml = { version = "1.2", default-features = false, features = ["parse", "serde", "std"] }
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }

[dev-dependencies]
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[[test]]
name = "desktop_smoke"
harness = false
