[package]
name = "dosa-dos"
version = "0.1.0"
edition = "2024"

[dependencies]
crc32fast = "1"
thiserror = "2"
font8x8 = "0.3.1"
dosa-cpu = { path = "../cpu" }
dosa-mount = { path = "../mount" }
oplon = { path = "../../vendor/oplon" }
rustysynth = "1.3.7"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
tempfile = "3"
