[package]
name = "dosa-mount"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
thiserror = "2"
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
