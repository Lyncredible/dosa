[package]
name = "dosa-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[dependencies]
cpal = "0.18.2"
font8x8 = "0.3.1"
png = "0.18"
pollster = "1.0"
rfd = "0.18.0"
wgpu = "30.0.2"
winit = "0.30.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_HiDpi",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }
